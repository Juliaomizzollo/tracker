<!DOCTYPE html>

  <main class="container">

    <div class="top-area">
      <h1>POMODORO</h1>
      <p class="mode" id="modeText">FOCO</p>
    </div>

    <div class="timer" id="timer">25:00</div>

    <div class="hourglass-wrapper">

      <div class="hourglass">

        <div class="glass top-glass">
          <div class="sand-top" id="sandTop"></div>
        </div>

        <div class="sand-stream" id="sandStream"></div>

        <div class="glass bottom-glass">
          <div class="sand-bottom" id="sandBottom"></div>
        </div>

      </div>

    </div>

    <div class="buttons">
      <button id="startBtn">Iniciar</button>
      <button id="pauseBtn">Pausar</button>
      <button id="resetBtn">Resetar</button>
    </div>

    <div class="stats">
      <div class="card">
        <h3>Ciclos completos</h3>
        <p id="cycles">0</p>
      </div>

      <div class="card">
        <h3>Status</h3>
        <p id="status">Mantenha o foco.</p>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
