<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Pomodoro Vintage</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
   min-height:100dvh;

    background:
    radial-gradient(circle at top, rgba(173,105,42,0.18), transparent 30%),
    linear-gradient(135deg,#0a0705,#140d08,#050403);

    overflow-y:auto;
    overflow-x:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    color:#f5dfc2;

    font-family:'Cormorant Garamond', serif;
}

.container{

    width:100%;
    max-width:1200px;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:25px;

    padding:40px 0;

    position:relative;
}

.title{

    font-family:'Cinzel', serif;

    letter-spacing:10px;

    font-size:4rem;

    color:#e6be8a;

    text-shadow:
    0 0 20px rgba(255,196,120,0.2);
}

.mode{

    letter-spacing:8px;

    font-size:1.2rem;

    color:#f7d8b0;
}

.timer{

    font-size:7rem;

    font-weight:300;

    text-shadow:
    0 0 30px rgba(255,220,180,0.12);
}

/* AMPULHETA */

.hourglass-area{

    position:relative;

    width:300px;
    height:420px;

    display:flex;
    justify-content:center;
    align-items:center;
}

.frame{

    position:absolute;

    width:240px;
    height:380px;

    border-radius:20px;

    border:4px solid rgba(180,120,60,0.5);

    box-shadow:
    0 0 40px rgba(0,0,0,0.5),
    inset 0 0 20px rgba(255,255,255,0.03);
}

.hourglass{

    position:relative;

    width:180px;
    height:300px;
}

.top,
.bottom{

    position:absolute;

    width:180px;
    height:140px;

    overflow:hidden;

    border:3px solid rgba(255,225,180,0.35);

    background:rgba(255,255,255,0.03);

    backdrop-filter:blur(3px);
}

.top{

    top:0;

    clip-path:polygon(
    0 0,
    100% 0,
    65% 100%,
    35% 100%
    );

    border-radius:15px 15px 80px 80px;
}

.bottom{

    bottom:0;

    clip-path:polygon(
    35% 0,
    65% 0,
    100% 100%,
    0 100%
    );

    border-radius:80px 80px 15px 15px;
}

.sand-top{

    position:absolute;
    bottom:0;

    width:100%;
    height:100%;

    background:
    linear-gradient(to bottom,#f2d3a2,#b97839);
}

.sand-bottom{

    position:absolute;
    bottom:0;

    width:100%;
    height:0%;

    background:
    linear-gradient(to top,#f2d3a2,#b97839);
}

.stream{

    position:absolute;

    left:50%;
    top:136px;

    transform:translateX(-50%);

    width:5px;
    height:35px;

    background:
    linear-gradient(to bottom,#f8e3bc,#c88b4f);

    border-radius:999px;

    box-shadow:
    0 0 12px rgba(255,220,180,0.8);

    animation:fall .15s linear infinite;
}

@keyframes fall{

    from{
        transform:
        translateX(-50%)
        translateY(-2px);
    }

    to{
        transform:
        translateX(-50%)
        translateY(2px);
    }
}

/* BOTÕES */

.buttons{

    display:flex;
    gap:18px;
}

button{

    border:none;

    padding:14px 30px;

    border-radius:999px;

    cursor:pointer;

    font-size:1rem;

    font-family:'Cinzel', serif;

    color:#f7dfc0;

    background:
    rgba(255,255,255,0.06);

    border:1px solid rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);

    transition:.3s;
}

button:hover{

    transform:translateY(-2px);

    background:
    rgba(255,255,255,0.1);

    box-shadow:
    0 0 25px rgba(255,196,120,0.15);
}

/* CARDS */

.info{

    display:flex;
    gap:20px;

    margin-top:10px;
}

.card{

    min-width:240px;

    padding:25px;

    border-radius:28px;

    background:
    rgba(255,255,255,0.04);

    border:1px solid rgba(255,255,255,0.06);

    text-align:center;

    backdrop-filter:blur(10px);

    box-shadow:
    0 0 30px rgba(0,0,0,0.35);
}

.card h3{

    font-family:'Cinzel', serif;

    color:#ddb27b;

    margin-bottom:12px;
}

.card p{

    font-size:2rem;
}

/* RESPONSIVO */

@media(max-width:768px){

    .title{
        font-size:2.5rem;
        text-align:center;
    }

    .timer{
        font-size:4rem;
    }

    .hourglass-area{
        transform:scale(.8);
    }

    .info{
        flex-direction:column;
    }

    .buttons{
        flex-wrap:wrap;
        justify-content:center;
    }
}

</style>
</head>
<body>

<div class="container">

    <h1 class="title">POMODORO</h1>

    <div class="mode" id="mode">FOCO</div>

    <div class="timer" id="timer">25:00</div>

    <div class="hourglass-area">

        <div class="frame"></div>

        <div class="hourglass">

            <div class="top">
                <div class="sand-top" id="sandTop"></div>
            </div>

            <div class="stream" id="stream"></div>

            <div class="bottom">
                <div class="sand-bottom" id="sandBottom"></div>
            </div>

        </div>

    </div>

    <div class="buttons">

        <button onclick="startTimer()">
            Iniciar
        </button>

        <button onclick="pauseTimer()">
            Pausar
        </button>

        <button onclick="resetTimer()">
            Resetar
        </button>

    </div>

    <div class="info">

        <div class="card">

            <h3>Ciclos completos</h3>

            <p id="cycles">0</p>

        </div>

        <div class="card">

            <h3>Status</h3>

            <p id="status">
                Mantenha o foco.
            </p>

        </div>

    </div>

</div>

<script>

let focusTime = 25 * 60
let breakTime = 5 * 60

let time = focusTime
let totalTime = focusTime

let isRunning = false
let isFocus = true

let cycles = 0

let interval = null

const timer = document.getElementById('timer')
const mode = document.getElementById('mode')
const cyclesEl = document.getElementById('cycles')
const statusEl = document.getElementById('status')

const sandTop = document.getElementById('sandTop')
const sandBottom = document.getElementById('sandBottom')

function updateDisplay(){

    const minutes = Math.floor(time / 60)
    const seconds = time % 60

    timer.innerText =
    `${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`

    const progress = time / totalTime

    sandTop.style.height =
    `${progress * 100}%`

    sandBottom.style.height =
    `${(1 - progress) * 100}%`
}

function switchMode(){

    if(isFocus){

        cycles++

        cyclesEl.innerText = cycles

        isFocus = false

        time = breakTime
        totalTime = breakTime

        mode.innerText = 'DESCANSO'

        statusEl.innerText =
        'Respire um pouco ☕'

    }else{

        isFocus = true

        time = focusTime
        totalTime = focusTime

        mode.innerText = 'FOCO'

        statusEl.innerText =
        'Hora de estudar ✨'
    }

    updateDisplay()
}

function startTimer(){

    if(isRunning) return

    isRunning = true

    interval = setInterval(()=>{

        time--

        updateDisplay()

        if(time <= 0){

            clearInterval(interval)

            isRunning = false

            switchMode()

            startTimer()
        }

    },1000)
}

function pauseTimer(){

    clearInterval(interval)

    isRunning = false
}

function resetTimer(){

    clearInterval(interval)

    isRunning = false

    isFocus = true

    time = focusTime
    totalTime = focusTime

    mode.innerText = 'FOCO'

    statusEl.innerText =
    'Mantenha o foco.'

    updateDisplay()
}

const today = new Date().toLocaleDateString()

const savedDate = localStorage.getItem('pomodoro-date')
const savedCycles = localStorage.getItem('pomodoro-cycles')

if(savedDate === today){

    cycles = Number(savedCycles || 0)

}else{

    cycles = 0

    localStorage.setItem('pomodoro-date', today)
}

cyclesEl.innerText = cycles
localStorage.setItem('pomodoro-cycles', cycles)
localStorage.setItem('pomodoro-date', today)

updateDisplay()

</script>

</body>
</html>
